<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>LUMINA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================
   🌙 GLOBAL RESET
========================= */

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

/* =========================
   🌌 STAGE LAYER
========================= */

.stage{
    width:100%;
    height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:16px;
    box-sizing:border-box;

    background:#0d0f17;
    color:#f0e6c8;
    font-family:'Cinzel', serif;
}

/* =========================
   📦 CARD (DEVICE CORE)
========================= */

.card{
    width:min(92vw,520px);
    max-width:520px;

    box-sizing:border-box;

    text-align:center;

    border:1px solid rgba(255,255,255,0.15);
    padding:28px;
    border-radius:20px;

    background:rgba(255,255,255,0.03);

    animation:borderPulse 4s infinite ease-in-out;
}

/* =========================
   ✦ TITLE
========================= */

.title{
    font-size:14px;
    letter-spacing:4px;
    margin-bottom:20px;
}

.sigil{
    display:inline-block;
    margin-right:8px;
    animation:sigilPulse 5s infinite ease-in-out;
}

/* =========================
   📊 DATA ROW
========================= */

.record{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
}

.ordia,
.cell,
.veil{
    font-size:24px;
    letter-spacing:2px;
}

.divider{
    width:1px;
    height:24px;
    background:rgba(240,230,200,0.25);
}

/* =========================
   🌙 ANIMATIONS
========================= */

@keyframes sigilPulse{
    0%{
        opacity:1;
        transform:scale(1);
    }
    25%{
        opacity:0.7;
        transform:scale(0.95);
    }
    50%{
        opacity:0.5;
        transform:scale(0.9);
    }
    75%{
        opacity:0.7;
        transform:scale(0.95);
    }
    100%{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes borderPulse{
    0%{
        border-color:rgba(255,255,255,0.08);
        box-shadow:0 0 0 rgba(240,230,200,0);
        transform:scale(1);
    }
    50%{
        border-color:rgba(240,230,200,0.65);
        box-shadow:0 0 25px rgba(240,230,200,0.25);
        transform:scale(1.003);
    }
    100%{
        border-color:rgba(255,255,255,0.08);
        box-shadow:0 0 0 rgba(240,230,200,0);
        transform:scale(1);
    }
}

</style>

</head>

<body>

<div class="stage">

    <div class="card">

        <div class="title">
            <span class="sigil">✦</span>
            LUMINA
        </div>

        <div class="record">

            <div class="ordia" id="ordia"></div>

            <div class="divider"></div>

            <div class="cell" id="cell"></div>

            <div class="divider"></div>

            <div class="veil" id="veil"></div>

        </div>

    </div>

</div>

<script>

const startDate = new Date("2025-12-20");
const today = new Date();

const days =
Math.floor((today - startDate) / (1000 * 60 * 60 * 24)) + 1;

const ordia =
Math.floor((days - 1) / 365) + 1;

const ordiaDay =
((days - 1) % 365) + 1;

/* =========================
   🌙 VEIL PHASE SYSTEM
========================= */

let veil;
let veilColor;

if(ordiaDay <= 90){
    veil = "フローラ";
    veilColor = "#E7B7C8";
}else if(ordiaDay <= 185){
    veil = "ルーヴァ";
    veilColor = "#E6B06A";
}else if(ordiaDay <= 270){
    veil = "ハーヴェル";
    veilColor = "#D8C06A";
}else{
    veil = "セレス";
    veilColor = "#DCE8F5";
}

/* =========================
   📊 OUTPUT
========================= */

document.getElementById("ordia").innerText =
`第${ordia}オルディア`;

document.getElementById("cell").innerText =
`第${days}セル`;

const veilElement = document.getElementById("veil");

veilElement.innerText = veil;
veilElement.style.color = veilColor;
veilElement.style.textShadow = `0 0 10px ${veilColor}66`;

</script>

</body>
</html>
